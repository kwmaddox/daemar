id: no-stringly-typed-field
valid:
  - |
    struct FreeText { name: String, stderr: String }
  - |
    struct Typed { kind: Kind, run_id: RunId, state: State }
  - |
    struct NameNearMisses { grid: String, id_kind_note: String, statement: String }
  - |
    struct NotBareString { kind: Option<Kind>, tags: Vec<String> }
  - |
    fn parameters_are_not_fields(kind: String) {}
invalid:
  - |
    struct Run { run_id: String }
  - |
    struct Change { kind: String }
  - |
    struct Session { status: String, state: String }
  - |
    struct Entry { entry_type: String }
  - |
    enum Event { Node { node_id: String } }
  - |
    struct Qualified { run_id: std::string::String }
  - |
    struct Absolute { status: ::std::string::String }
  - |
    struct AllocPath { state: alloc::string::String }
  # PER-68 rereview finding P3: r# is not part of the identifier — raw
  # spellings resolve to ordinary String.
  - |
    struct RawType { status: r#String }
  - |
    struct RawTail { status: std::string::r#String }
  - |
    struct RawEverySegment { status: ::r#std::r#string::r#String }
  - |
    struct RawAllocTail { status: alloc::string::r#String }

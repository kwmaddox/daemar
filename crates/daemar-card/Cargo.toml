[package]
name = "daemar-card"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Daemar Card store and the agent-facing `card` CLI (PER-82)"

[lints]
workspace = true

[[bin]]
name = "card"
path = "src/main.rs"

# Executable behavior spec (S1-B1…S1-B14): cucumber drives the compiled
# `card` binary, so the default libtest harness is replaced by the
# cucumber runner's own main.
[[test]]
name = "behavior"
harness = false

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite", "time"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
cucumber = "0.21"
tempfile = "3"

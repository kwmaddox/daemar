# The subtlety class: in the first hand-run A/B, the cheap airframe mapped
# territory correctly but missed a wiring implication. This case targets that
# gap — the answer needs the roster binding AND the config fallback AND the
# when (startup, not per call). The citations are mechanical; whether the
# report grasps the lifecycle is the human-review question.

schema = "daemar.eval-case.v1"
id = "scout.wiring-subtlety"
class = ["scout", "wiring", "subtlety"]
role = "scout"
workflow = "scout"

request = """
Which environment variable binds the scout role's model (airframe), and what
happens when that variable is unset? Cite, in backticks as `path:line` or
`path:start-end`: (a) the exact line in the roster where the scout's model
env var is declared, and (b) the exact line in config where an unset
role-specific variable falls back to the default model. Also state at what
point in the process lifecycle role models are resolved, and what that
implies for changing models mid-process.
"""

territory_repo = "."
territory_commit = "6ee526ef2400f6748917e8c652c91fddb5493ac9"

[[required]]
path = "crates/factory/src/roster.rs"
line = 54
verbatim = "DAEMAR_SCOUT_MODEL"

[[required]]
path = "crates/factory/src/config.rs"
line = 171
verbatim = ".or_else(|| default_model.clone())"

[[required_text]]
contains = "DAEMAR_MODEL"

[human_review]
questions = [
    "Did the report state that resolution happens once, fail-fast, at Config::from_env (startup) — so a model change requires a new process?",
]

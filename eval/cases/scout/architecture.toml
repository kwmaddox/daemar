# The navigation baseline: can the scout walk from the CLI's front door to
# the workflow seam and cite both ends exactly? This is the bread-and-butter
# "where does X live" scouting the cheap airframe should also pass — and it
# encodes the citation both airframes contested in the first hand-run A/B
# (terra said main.rs:44's arm, luna said :49-51; the tree says terra).

schema = "daemar.eval-case.v1"
id = "scout.architecture"
class = ["scout", "navigation"]
role = "scout"
workflow = "scout"

request = """
Where does the daemar CLI dispatch the `scout` subcommand, and where is the
scout workflow function itself declared in the factory library? Answer with
exact citations in backticks, as `path:line` or `path:start-end`: (a) the
match arm in the CLI that dispatches the scout subcommand, and (b) the
declaration line of the scout workflow function. Briefly explain how the two
connect.
"""

territory_repo = "."
territory_commit = "6ee526ef2400f6748917e8c652c91fddb5493ac9"

[[required]]
path = "apps/daemar/src/main.rs"
line = 44
verbatim = 'Some("scout")'

[[required]]
path = "crates/factory/src/workflows.rs"
line = 189
verbatim = "pub fn scout_flight("

[[required_text]]
contains = "scout_flight"

[human_review]
questions = [
    "Did the report explain the dispatch chain (CLI arm -> territory_dispatch -> scout_flight) rather than just list two locations?",
]

# The factory's own code gate: exactly `just check`, enforced.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  # Re-runnable by hand. Earned the hard way: during a GitHub Actions
  # incident a run sat queued for hours with no way to retrigger it except
  # pushing a junk commit, and a stuck run is indistinguishable from a
  # broken one until you can ask again.
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the eval corpus test validates answer keys against
          # their PINNED commits via `git show` — a shallow clone cannot.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The wall adapter links the VMM, which needs libcap-ng on Linux.
      # Found the honest way: the linker said `unable to find -lcap-ng`.
      - name: linux system libraries the wall needs
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      # The cage proof is a REQUIRED check, invoked explicitly — never a
      # silent skip. cargo test above stays docker-free by design.
      - name: cage image
        run: docker build -f Dockerfile.cage -t daemar-cage:latest .
      - name: caged proof flights
        run: cargo test -p daemar --test cage -- --ignored

  # Can a hosted runner hold a microVM at all? Asked, not assumed. This job
  # is allowed to fail: its VERDICT is the deliverable, and it decides
  # whether the microVM proofs can ever be a required check here or must
  # move to a KVM-capable self-hosted runner. Docker remains the CI wall
  # either way — the seam is what makes that a configuration choice rather
  # than a compromise.
  microvm-capability-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: does this runner have hardware virtualization
        run: |
          # tee, not redirect: a verdict only in the step summary is a
          # verdict the logs cannot answer with.
          say() { echo "$1" | tee -a $GITHUB_STEP_SUMMARY; }
          say "### microVM capability probe"
          if [ -e /dev/kvm ]; then
            say "- /dev/kvm EXISTS: $(ls -l /dev/kvm)"
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              say "- VERDICT: usable by $(id -un) — microVM proofs CAN run on hosted runners"
            else
              say "- VERDICT: present but NOT accessible to $(id -un) (groups: $(id -Gn))"
            fi
          else
            say "- VERDICT: /dev/kvm ABSENT — microVMs cannot run on hosted runners"
          fi
          say "- cpu flags: $(grep -o -m1 -E 'vmx|svm' /proc/cpuinfo || echo none)"
      # The verdict above says the hardware is there and only the
      # permission is missing. So ask the only question that settles it:
      # after granting access, does a microVM actually boot and answer?
      - name: can a microVM actually run here
        run: |
          say() { echo "$1" | tee -a $GITHUB_STEP_SUMMARY; }
          sudo chmod 666 /dev/kvm || true
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            say "- /dev/kvm made accessible with a single chmod"
          else
            say "- /dev/kvm STILL inaccessible after chmod"; exit 0
          fi
          curl -sSL https://get.microsandbox.dev | sh >/dev/null 2>&1 || {
            say "- microsandbox install FAILED on this runner"; exit 0; }
          export PATH="$HOME/.microsandbox/bin:$PATH"
          msb doctor 2>&1 | tail -3 | tee -a $GITHUB_STEP_SUMMARY || true
          if timeout 300 msb create --name ci-probe alpine >/dev/null 2>&1; then
            out=$(msb exec ci-probe -- echo booted 2>&1 | tail -1)
            say "- BOOT VERDICT: a microVM ran on a hosted runner and said: $out"
            msb rm -f ci-probe >/dev/null 2>&1 || true
          else
            say "- BOOT VERDICT: sandbox creation FAILED — hosted runners cannot host the wall"
          fi

      - name: can the wall adapter even be built here
        run: |
          # Building the VMM is a separate question from running it, and CI
          # must at least compile what it ships.
          sudo apt-get update && sudo apt-get install -y libcap-ng-dev
          /usr/bin/time -f 'wall build: %E elapsed' cargo build -p daemar 2>&1 | tail -2 \
            | tee -a $GITHUB_STEP_SUMMARY

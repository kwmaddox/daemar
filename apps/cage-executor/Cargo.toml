[package]
name = "cage-executor"
version = "0.1.0"
edition = "2021"
description = "The sandbox's sole inhabitant: one tool request per invocation."

# DELIBERATELY MINIMAL. This binary runs INSIDE the wall, so it must be
# buildable in a bare musl image and must not be able to reach host
# concerns even by accident: no provider, no vault, and — since the wall
# adapter began linking a hypervisor — no sandbox runtime either. The
# package boundary is what makes that a compile-time fact rather than a
# promise. (Learned live: while it shared a package with the CLI, adding
# the microsandbox SDK made the cage image unbuildable on Alpine.)
[dependencies]
factory = { path = "../../crates/factory" }
serde_json = "1"

[[bin]]
name = "cage_executor"
path = "src/main.rs"

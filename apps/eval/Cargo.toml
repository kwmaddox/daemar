[package]
name = "daemar-eval"
version = "0.1.0"
edition = "2021"
description = "The eval rig: deliberate, paid flights that measure airframes against pinned territories."

[dependencies]
factory = { path = "../../crates/factory" }
ledger = { path = "../../crates/ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Justified dep: cases are reviewed, commented fixtures — TOML for the same
# reason airframes.toml is TOML (comments and dated entries must be possible).
toml = "0.8"

[package]
name = "daemar"
version = "0.1.0"
edition = "2021"
description = "The factory's CLI: a thin skin over the factory crate."

[dependencies]
factory = { path = "../../crates/factory" }
# The MCP tower folds slips for its `slip` tool and speaks JSON-RPC.
ledger = { path = "../../crates/ledger" }
serde_json = "1"
# The wall this executable injects into its Config. The VMM and its async
# runtime live behind this dependency, not here.
walls = { path = "../../crates/walls" }
